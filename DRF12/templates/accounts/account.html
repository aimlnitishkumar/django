
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Accounts</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .nav-right {
            font-size: 14px;
            color: #cbd5e1;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 30px;
        }

        .heading p {
            color: #64748b;
            margin-top: 5px;
        }

        /* ================= BUTTON ================= */

        .refresh-btn {
            border: none;
            background: #2563eb;
            color: white;

            padding: 11px 18px;
            border-radius: 8px;

            cursor: pointer;
            font-size: 14px;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        /* ================= CARDS ================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;

            border-radius: 14px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }

        .balance {
            color: #16a34a;
        }

        .accounts {
            color: #2563eb;
        }

        /* ================= TABLE SECTION ================= */

        .table-container {
            background: white;
            border-radius: 14px;

            padding: 25px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 20px;
        }

        /* ================= SEARCH ================= */

        .search {
            padding: 10px 14px;

            width: 240px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
        }

        /* ================= TABLE ================= */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        th {
            text-align: left;
            padding: 14px;

            font-size: 13px;
            color: #64748b;

            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 16px 14px;

            border-bottom: 1px solid #f1f5f9;

            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .account-number {
            font-weight: bold;
            color: #2563eb;
        }

        .holder {
            font-weight: 600;
        }

        .balance-cell {
            font-weight: bold;
            color: #16a34a;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        /* ================= ERROR ================= */

        .error {
            display: none;

            background: #fee2e2;
            color: #b91c1c;

            padding: 15px;
            border-radius: 8px;

            margin-bottom: 20px;
        }

        /* ================= EMPTY ================= */

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .heading {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .table-container {
                padding: 15px;
                overflow-x: auto;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search {
                width: 100%;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Bank<span>System</span>
        </div>

        <div class="nav-right">
            Account Management
        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <div class="container">

        <div class="heading">

            <div>
                <h1>Account Dashboard</h1>

                <p>
                    Manage and view all bank accounts
                </p>
            </div>

            <button class="refresh-btn" onclick="loadAccounts()">
                ↻ Refresh
            </button>

        </div>


        <!-- ERROR -->

        <div id="errorMessage" class="error">
            Unable to load account data.
        </div>


        <!-- ================= CARDS ================= -->

        <div class="cards">

            <div class="card">

                <div class="card-title">
                    Total Accounts
                </div>

                <div
                    id="totalAccounts"
                    class="card-value accounts">
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Total Balance
                </div>

                <div
                    id="totalBalance"
                    class="card-value balance">
                    ₹0
                </div>

            </div>

        </div>


        <!-- ================= TABLE ================= -->

        <div class="table-container">

            <div class="table-header">

                <h2>
                    All Accounts
                </h2>

                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="Search account..."
                    onkeyup="searchAccounts()"
                >

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Account Number
                        </th>

                        <th>
                            Account Holder
                        </th>

                        <th>
                            Balance
                        </th>

                    </tr>

                </thead>


                <tbody id="accountTable">

                    <tr>

                        <td
                            colspan="3"
                            class="loading">

                            Loading accounts...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        let accounts = [];


        // ================= LOAD ACCOUNTS =================

        function loadAccounts() {

            const table =
                document.getElementById("accountTable");

            const error =
                document.getElementById("errorMessage");


            table.innerHTML = `
                <tr>
                    <td colspan="3" class="loading">
                        Loading accounts...
                    </td>
                </tr>
            `;

            error.style.display = "none";


            fetch("/accounts/")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("API request failed");
                    }

                    return response.json();

                })

                .then(data => {

                    accounts = data;

                    displayAccounts(accounts);

                    updateDashboard(accounts);

                })

                .catch(error => {

                    console.error(error);

                    table.innerHTML = `
                        <tr>
                            <td colspan="3" class="empty">
                                Unable to load accounts.
                            </td>
                        </tr>
                    `;

                    document.getElementById(
                        "errorMessage"
                    ).style.display = "block";

                });

        }


        // ================= DISPLAY ACCOUNTS =================

        function displayAccounts(data) {

            const table =
                document.getElementById("accountTable");


            table.innerHTML = "";


            if (data.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="3" class="empty">
                            No accounts found.
                        </td>
                    </tr>
                `;

                return;
            }


            data.forEach(account => {

                const row = document.createElement("tr");


                row.innerHTML = `

                    <td class="account-number">
                        #${account.account_number}
                    </td>

                    <td class="holder">
                        ${account.account_holder}
                    </td>

                    <td class="balance-cell">
                        ₹${Number(account.balance).toLocaleString("en-IN")}
                    </td>

                `;


                table.appendChild(row);

            });

        }


        // ================= DASHBOARD =================

        function updateDashboard(data) {

            document.getElementById(
                "totalAccounts"
            ).textContent = data.length;


            let total = 0;


            data.forEach(account => {

                total += Number(account.balance);

            });


            document.getElementById(
                "totalBalance"
            ).textContent =
                "₹" + total.toLocaleString("en-IN");

        }


        // ================= SEARCH =================

        function searchAccounts() {

            const search =
                document.getElementById(
                    "searchInput"
                ).value.toLowerCase();


            const filtered =
                accounts.filter(account =>

                    account.account_holder
                        .toLowerCase()
                        .includes(search)

                    ||

                    String(account.account_number)
                        .includes(search)

                );


            displayAccounts(filtered);

        }


        // ================= INITIAL LOAD =================

        loadAccounts();

    </script>

</body>

</html>
