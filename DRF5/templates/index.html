
<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>

    <h1>Nitty's Blogs</h1>

    {% for post in posts reversed %}
        <a href="" style="text-decoration: none; color: black;" >
        <h2>{{ post.title }}</h2>
        <h3>{{post.created_at}}</h3>
        <p>{{ post.body |truncatewords:20 }}</p>
        </a>
        <hr>
    {% empty %}
        <p>No posts found.</p>
    {% endfor %}

</body>
</html>
