<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>All Products</h1>

    {% for product in products %}
    <h2>{{ product.product_name }}</h2>
    <p>Product ID: {{ product.product_id }}</p>
    <p>Price: ₹{{ product.price }}</p>
    {% endfor %}
</body>
</html>
